<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0d0f14"/>
  
  <!-- Concentric radar rings -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#c0392b" stroke-width="0.8" opacity="0.35"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#c0392b" stroke-width="0.8" opacity="0.5"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#c0392b" stroke-width="0.8" opacity="0.7"/>
  <circle cx="32" cy="32" r="4"  fill="none" stroke="#c0392b" stroke-width="1" opacity="0.9"/>

  <!-- Crosshair lines -->
  <line x1="4"  y1="32" x2="60" y2="32" stroke="#c0392b" stroke-width="0.7" opacity="0.4"/>
  <line x1="32" y1="4"  x2="32" y2="60" stroke="#c0392b" stroke-width="0.7" opacity="0.4"/>
  <line x1="12" y1="12" x2="52" y2="52" stroke="#c0392b" stroke-width="0.4" opacity="0.2"/>
  <line x1="52" y1="12" x2="12" y2="52" stroke="#c0392b" stroke-width="0.4" opacity="0.2"/>

  <!-- Green radar sweep arc -->
  <path d="M32,32 L60,32 A28,28 0 0,0 32,4 Z" fill="#00ff4114"/>
  <path d="M32,32 L60,32 A28,28 0 0,0 52,12 Z" fill="#00ff4108"/>
  <line x1="32" y1="32" x2="60" y2="32" stroke="#00ff41" stroke-width="1.5" opacity="0.85"/>
  <line x1="32" y1="32" x2="32" y2="4"  stroke="#00ff41" stroke-width="0.8" opacity="0.3"/>

  <!-- Primary locked target - top right -->
  <circle cx="52" cy="14" r="5" fill="none" stroke="#c0392b" stroke-width="1.2"/>
  <circle cx="52" cy="14" r="9" fill="none" stroke="#c0392b" stroke-width="0.6" opacity="0.5"/>
  <circle cx="52" cy="14" r="2" fill="#c0392b"/>
  <!-- Lock brackets -->
  <path d="M48,10 L46,10 L46,12" fill="none" stroke="#c0392b" stroke-width="1"/>
  <path d="M56,10 L58,10 L58,12" fill="none" stroke="#c0392b" stroke-width="1"/>
  <path d="M48,18 L46,18 L46,16" fill="none" stroke="#c0392b" stroke-width="1"/>
  <path d="M56,18 L58,18 L58,16" fill="none" stroke="#c0392b" stroke-width="1"/>

  <!-- Secondary contacts - faint blips -->
  <circle cx="18" cy="44" r="2" fill="#c0392b" opacity="0.55"/>
  <circle cx="18" cy="44" r="4" fill="none" stroke="#c0392b" stroke-width="0.6" opacity="0.3"/>
  <circle cx="44" cy="50" r="1.5" fill="#00ff41" opacity="0.7"/>
  <circle cx="14" cy="22" r="1.5" fill="#c0392b" opacity="0.35"/>

  <!-- Center origin point -->
  <circle cx="32" cy="32" r="2.5" fill="#00ff41"/>
  <circle cx="32" cy="32" r="1"   fill="#ffffff"/>
</svg>